# ITNOA
# Based on https://github.com/flcdrg/VsShowMissing

name: CI


# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_unstable:
        description: Run opt-in conntrack/kernel tests on a disposable runner
        type: boolean
        default: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use
  PRODUCT_VERSION: '0.1.0'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: build-${{matrix.os}}
    strategy:
      matrix:
        # 
        os: [ubuntu-latest]

    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }} 

    - name: Runner contract tests
      run: |
        ./scripts/tests/test-runner.sh
        python3 scripts/tests/test-native-results.py

    - name: Managed tests
      run: ./test.sh --fast

    - name: Stable native and system tests
      run: |
        mkdir -p artifacts
        ./test.sh --full --iptables-backend legacy --logger "trx;LogFileName=$PWD/artifacts/stable.trx"

    - name: Require native coverage and report skips
      if: always()
      run: python3 scripts/check-native-results.py artifacts/stable.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stable-test-results
        path: artifacts/*.trx

  unstable:
    if: github.event_name == 'workflow_dispatch' && inputs.run_unstable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Opt-in kernel tests
        run: |
          mkdir -p artifacts
          RUN_UNSTABLE_SYSTEM_TESTS=1 timeout 10m ./test.sh --full --filter 'Category=NotWorkingOnTravis' --logger "trx;LogFileName=$PWD/artifacts/unstable.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unstable-test-results
          path: artifacts/*.trx

  upload:
    name: upload
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }} 
    - name: Upload
      run: bash nuget-upload.sh
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
